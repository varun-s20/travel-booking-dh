# Netlify: build and serve the Landfall app (landfall/site), not the repo root.
# This file overrides the build settings in the Netlify dashboard.
# Secrets (Supabase, Stripe, Duffel keys) are NOT set here: add them in
# Netlify > Site configuration > Environment variables (see landfall/site/docs/SETUP.md).

[build]
  base = "landfall/site"
  # plain `next build`: the npm build:navy script would build into .next-navy,
  # but Netlify's Next.js runtime serves the standard .next folder
  command = "npx next build"
  publish = ".next"

# Netlify's Next.js runtime: turns the .next build into pages, API functions and the proxy.
# Declared explicitly because auto-detection missed the app in a subfolder, and without it
# Netlify uploads .next as plain files (every page 404s and build internals become public).
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_PALETTE = "navy"
  NEXT_DIST_DIR = ".next"
  NEXT_TELEMETRY_DISABLED = "1"
  # Netlify's secret scan fails the build when an env var's value appears in the repo or the build.
  # These values are public by design (browser keys, addresses, settings), so they are not scanned.
  # The real secrets (SUPABASE_SECRET_KEY, DUFFEL_*, SMTP_PASSWORD, STRIPE_SECRET_KEY,
  # STRIPE_WEBHOOK_SECRET, DATA_ENCRYPTION_KEY, CRON_SECRET) are still scanned on every build.
  SECRETS_SCAN_OMIT_KEYS = "APP_URL,APP_CURRENCY,EMAIL_FROM,SMTP_HOST,SMTP_PORT,SMTP_USER,SUPPORT_EMAIL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY,PRICE_MARKUP_PERCENT,PRICE_MARKUP_FIXED_CENTS,FUNCTION_TIME_LIMIT_SECONDS,NEXT_PUBLIC_PALETTE,NEXT_DIST_DIR"
