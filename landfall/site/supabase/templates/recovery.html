<!-- Landfall: password reset (Supabase Auth > Email Templates > Reset password).
     Subject: Reset your Landfall password
     The link goes to the app's /auth/confirm route, which verifies the token on the server. -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:520px;margin:0 auto;padding:32px 24px;color:#16225A">
  <p style="font-size:20px;font-weight:bold;margin:0 0 24px">Landfall</p>
  <h1 style="font-size:22px;margin:0 0 12px">Reset your password</h1>
  <p style="font-size:16px;line-height:1.5;margin:0 0 24px">We got a request to reset the password for this account. The link works once and expires in one hour.</p>
  <p style="margin:0 0 24px"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password" style="background:#14A08B;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:999px;font-weight:bold;display:inline-block">Choose a new password</a></p>
  <p style="font-size:14px;line-height:1.5;color:#555;margin:0">If you didn't ask for this, you can ignore this email. Your password stays the same.</p>
</div>
